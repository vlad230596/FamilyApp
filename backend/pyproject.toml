[tool.poetry]
name = "familyapp-backend"
version = "0.5.0"
description = "Flask backend for FamilyApp."
authors = ["FamilyApp"]
readme = "../README.md"
packages = [{ include = "familyapp" }]

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0.0"
gunicorn = ">=23,<24"
tzdata = "^2026.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
