name: Release FamilyApp
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example 0.1.0, without v)
        required: true
        type: string
concurrency:
  group: familyapp-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      backend: ${{ steps.backend.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 64
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION^{commit}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check backend
        working-directory: backend
        run: |
          pip install poetry==2.3.4
          poetry install --no-interaction
          poetry run pytest
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Check and build Flutter web
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL=https://famly-app.duckdns.org:8443
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: backend
        with:
          context: backend
          push: true
          tags: ghcr.io/vlad230596/familyapp-backend:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: web
        with:
          context: app
          file: app/Dockerfile.web
          push: true
          tags: ghcr.io/vlad230596/familyapp-web:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://famly-app.duckdns.org:8443
    permissions:
      packages: read
    steps:
      - name: Deploy immutable images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          VERSION: ${{ needs.publish.outputs.version }}
          BACKEND: ghcr.io/vlad230596/familyapp-backend@${{ needs.publish.outputs.backend }}
          WEB: ghcr.io/vlad230596/familyapp-web@${{ needs.publish.outputs.web }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/familyapp
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/familyapp ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/familyapp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "deploy $VERSION $BACKEND $WEB $REGISTRY_USER"
